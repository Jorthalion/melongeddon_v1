# Builds the Windows installer (Melongeddon-Setup-<version>.exe).
#
# - Push a version tag to publish it as a GitHub Release:
#     git tag v0.2.0
#     git push origin v0.2.0
#   The tag sets the installer's version number.
# - Or run it by hand (Actions -> "Build Windows installer" -> Run workflow) to get the .exe as a
#   downloadable artifact without making a release.
name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build the installer
        run: npm run installer

      - name: Smoke test the packaged app
        shell: bash
        env:
          MELONGEDDON_SMOKE: "1"
        run: |
          ./release/installer/win-unpacked/Melongeddon.exe | tee smoke.txt
          grep -q '"ok":true' smoke.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Melongeddon-Setup
          path: release/installer/Melongeddon-Setup-*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/installer/Melongeddon-Setup-*.exe
          generate_release_notes: true
